<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestor de Visitas & Serviços</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }
    input, textarea {
      width: 100%; background: #0b1120; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; padding: 12px; font-size: 0.95rem; margin-bottom: 12px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    button {
      width: 100%; background: var(--primary); color: white; border: none;
      border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .btn-del { background: #dc2626; padding: 6px 12px; font-size: 0.8rem; width: auto; border-radius: 6px; }
    .btn-agenda { background: var(--success); padding: 6px 12px; font-size: 0.8rem; width: auto; border-radius: 6px; text-decoration: none; color: white; display: inline-block; }
    .badge { display: inline-block; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; background: #3b82f620; color: #60a5fa; margin-bottom: 8px; }
    .agenda-item { background: #0b1120; border-left: 4px solid var(--primary); padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    .agenda-title { font-weight: 600; font-size: 1rem; margin-bottom: 6px; }
    .agenda-desc { font-size: 0.85rem; color: #cbd5e1; white-space: pre-wrap; line-height: 1.4; margin-bottom: 10px; }
    .item-actions { display: flex; gap: 8px; align-items: center; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>📋 Gestor de Visitas</h1>
    <span onclick="toggleConfig()" style="cursor:pointer; font-size: 1.4rem;">⚙️</span>
  </header>

  <div id="config-card" class="card hidden">
    <label for="apiKey">Chave de API do Google Gemini</label>
    <input type="password" id="apiKey" placeholder="Cole sua chave AI Studio aqui">
    <button onclick="salvarConfig()">Salvar Chave</button>
  </div>

  <div class="card">
    <span class="badge">Assistente IA Ativo</span>
    <label for="promptInput">Descreva a visita ou cole o texto do cliente:</label>
    <textarea id="promptInput" rows="3" placeholder="Ex: Visita amanhã às 14h com o Fernando para orçamento de câmeras na Rua Goiás 120"></textarea>
    <button id="btnProcessar" onclick="processarComGemini()">Organizar & Agendar</button>
  </div>

  <div class="card">
    <h2 style="font-size: 1rem; margin-bottom: 12px;">Próximos Atendimentos</h2>
    <div id="listaVisitas"></div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let visitas = JSON.parse(localStorage.getItem('minhas_visitas') || '[]');

    if (!apiKey) {
      document.getElementById('config-card').classList.remove('hidden');
    }

    function toggleConfig() {
      document.getElementById('config-card').classList.toggle('hidden');
    }

    function salvarConfig() {
      const inputChave = document.getElementById('apiKey').value.trim();
      if (inputChave) {
        localStorage.setItem('gemini_api_key', inputChave);
        apiKey = inputChave;
        document.getElementById('config-card').classList.add('hidden');
        alert('Chave salva com sucesso!');
      } else {
        alert('Cole uma chave de API válida.');
      }
    }

    function renderizarVisitas() {
      const container = document.getElementById('listaVisitas');
      if (visitas.length === 0) {
        container.innerHTML = '<p style="color: var(--muted); font-size: 0.85rem;">Nenhuma visita agendada ainda.</p>';
        return;
      }
      container.innerHTML = visitas.map((v, i) => {
        const textoGoogleAgenda = encodeURIComponent(`Visita: ${v.cliente} - ${v.servico}\nLocal: ${v.endereco}\nMateriais: ${v.materiais || 'Nenhum'}`);
        const linkAgenda = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(v.servico + ' - ' + v.cliente)}&details=${textoGoogleAgenda}&location=${encodeURIComponent(v.endereco || '')}`;

        return `
          <div class="agenda-item">
            <div class="agenda-title">${v.cliente || 'Cliente'} — ${v.servico || 'Serviço'}</div>
            <div class="agenda-desc">📅 <b>Data/Hora:</b> ${v.data_hora || 'A combinar'}\n📍 <b>Local:</b> ${v.endereco || 'Não informado'}\n🧰 <b>Materiais:</b> ${v.materiais || 'Padrão'}</div>
            <div class="item-actions">
              <a href="${linkAgenda}" target="_blank" class="btn-agenda">📅 Adicionar à Agenda</a>
              <button class="btn-del" onclick="removerVisita(${i})">Excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removerVisita(index) {
      visitas.splice(index, 1);
      localStorage.setItem('minhas_visitas', JSON.stringify(visitas));
      renderizarVisitas();
    }

    async function processarComGemini() {
      const chaveAtual = apiKey || localStorage.getItem('gemini_api_key');
      if (!chaveAtual) {
        alert('Configure sua Chave de API clicando na engrenagem ⚙️');
        document.getElementById('config-card').classList.remove('hidden');
        return;
      }

      const input = document.getElementById('promptInput').value.trim();
      if (!input) {
        alert('Escreva os detalhes da visita antes de agendar.');
        return;
      }

      const btn = document.getElementById('btnProcessar');
      btn.innerText = 'Organizando com IA... Aguarde';
      btn.disabled = true;

      const promptSistema = "Você é um assistente de gestão técnica. Extraia as informações do texto e responda EXCLUSIVAMENTE um objeto JSON válido, sem qualquer formatação markdown ou crases:\n" +
        "{\n" +
        '  "cliente": "Nome do cliente ou Empresa",\n' +
        '  "servico": "Resumo do serviço a realizar",\n' +
        '  "data_hora": "Data e horário informados",\n' +
        '  "endereco": "Endereço ou Local informado",\n' +
        '  "materiais": "Materiais, ferramentas ou equipamentos necessários deduzidos ou citados"\n' +
        "}";

      // Lista de modelos suportados para redundância automática
      const modelos = ['gemini-2.5-flash', 'gemini-3.8-flash'];
      let resultado = null;
      let erroFinal = '';

      for (const modelo of modelos) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chaveAtual}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: promptSistema + "\n\nTexto do agendamento: " + input }] }]
            })
          });

          const data = await res.json();
          if (data.error) {
            erroFinal = data.error.message;
            continue;
          }

          if (data.candidates && data.candidates[0] && data.candidates[0].content) {
            const rawText = data.candidates[0].content.parts[0].text;
            const limpo = rawText.replace(/```json|```/g, '').trim();
            resultado = JSON.parse(limpo);
            break;
          }
        } catch (e) {
          erroFinal = e.message;
        }
      }

      if (resultado) {
        visitas.unshift(resultado);
        localStorage.setItem('minhas_visitas', JSON.stringify(visitas));
        renderizarVisitas();
        document.getElementById('promptInput').value = '';
      } else {
        alert('Não foi possível processar agora. Motivo: ' + erroFinal);
      }

      btn.innerText = 'Organizar & Agendar';
      btn.disabled = false;
    }

    renderizarVisitas();
  </script>
</body>
</html>
